name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Commit dependency lock snapshot (same-repository release branch only)
        if: github.head_ref == 'feature/phase21-reproducible-builds' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin feature/phase21-reproducible-builds
          git switch -C feature/phase21-reproducible-builds FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: commit npm dependency integrity graph'
            git push origin HEAD:feature/phase21-reproducible-builds
          fi
      - run: npm run check
      - run: npm test
